<svg width="420" height="240" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
        </linearGradient>
        <filter id="glow2">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="420" height="240" rx="12" fill="url(#bg2)"/>
    <rect width="420" height="240" rx="12" fill="none"
          stroke="#FFD700" stroke-width="1" opacity="0.4"/>

    <!-- Top accent line -->
    <rect width="420" height="3" rx="12" fill="#FFD700" opacity="0.8"/>

    <!-- Issuer badge -->
    <rect x="20" y="20" width="auto" height="22" rx="11"
          fill="#FFD700" opacity="0.15"/>
    <text x="20" y="20" font-family="monospace" font-size="10"
          fill="#FFD700" font-weight="bold">
        <tspan dy="15">TESTDOME</tspan>
    </text>

    <!-- Certificate name -->
    <text x="20" y="60" font-family="monospace" font-size="15"
          fill="white" font-weight="bold">
        <tspan x="20" dy="0">TestDome Python — Top 10%</tspan>
    </text>
    

    <!-- Level badge -->
    <rect x="20" y="95" width="130" height="20" rx="10"
          fill="#FFD700" opacity="0.15"/>
    <text x="28" y="109" font-family="monospace" font-size="10"
          fill="#FFD700" font-weight="bold">
        TOP 10%
    </text>

    <!-- Date -->
    <text x="165" y="109" font-family="monospace" font-size="10"
          fill="white" opacity="0.5">
        📅 18 Mei 2026
    </text>

    <!-- Divider -->
    <line x1="20" y1="125" x2="400" y2="125"
          stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>

    <!-- Skills -->
    <text x="20" y="145" font-family="monospace" font-size="9"
          fill="white" opacity="0.4">SKILLS COVERED</text>
    <text x="20" y="162" font-family="monospace" font-size="10"
          fill="#FFD700" opacity="0.8">
        —
    </text>

    
    

    <!-- Bottom decoration -->
    <circle cx="405" cy="225" r="3" fill="#FFD700" opacity="0.4"/>
    <circle cx="395" cy="225" r="2" fill="#FFD700" opacity="0.2"/>
</svg>